name: demo

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test demo-related packages
        run: make test-demo
      - name: Check Go formatting
        run: make fmt-check
