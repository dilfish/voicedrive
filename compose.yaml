services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicedrive
      POSTGRES_USER: voicedrive
      POSTGRES_PASSWORD: voicedrive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedrive -d voicedrive"]
      interval: 2s
      timeout: 3s
      retries: 15
